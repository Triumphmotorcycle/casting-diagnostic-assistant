<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1280" role="img" aria-labelledby="title desc">
<title id="title">Sprue shape, size and flow dynamics</title><desc id="desc">Six sprue profiles and their original green-to-red guidance markers, redrawn from the TJ Gold and Diamond Guidelines page 7.</desc>
<rect width="1020" height="1280" fill="#dedede"/>
<g fill="#111" font-family="Arial,sans-serif"><text x="60" y="70" font-size="34" font-weight="700">SPRUE SHAPE, SIZE AND</text><text x="60" y="112" font-size="34" font-weight="700">FLOW DYNAMICS</text><text x="60" y="150" font-size="22">Note: Basic shapes will often be mixed, i.e. flared/almond,</text><text x="60" y="178" font-size="22">flattened/flared, etc.</text></g>
<g fill="#111" font-family="Arial,sans-serif" font-size="29" text-anchor="middle">
<text x="170" y="270">Straight</text><text x="510" y="270">Flared/Round</text><text x="850" y="270">Flat/Round/Flare</text>
<text x="170" y="760">Square</text><text x="510" y="760">Acute Almond</text><text x="850" y="760">Tapered</text></g>
<g fill="#1e355e" stroke="none">
<!-- Straight -->
<rect x="110" y="330" width="54" height="160"/><circle cx="240" cy="410" r="49"/>
<!-- Flared / round -->
<path d="M450 330 L570 330 Q584 350 566 370 L566 490 L454 490 L454 370 Q436 350 450 330Z"/><circle cx="650" cy="410" r="49" stroke="#8fb5c9" stroke-width="14"/>
<!-- Flat / round / flare -->
<rect x="780" y="330" width="54" height="160"/><rect x="875" y="340" width="58" height="110" rx="28" stroke="#8fb5c9" stroke-width="12"/><path d="M860 470 Q905 445 950 470 L932 490 L878 490Z"/>
<!-- Square -->
<rect x="130" y="820" width="54" height="160"/><rect x="225" y="875" width="48" height="80"/>
<!-- Acute almond -->
<rect x="450" y="820" width="54" height="160"/><path d="M650 860 Q710 920 650 980 Q590 920 650 860Z"/>
<!-- Tapered -->
<path d="M780 980 L780 855 L795 820 L835 820 L850 855 L850 980Z"/><circle cx="920" cy="900" r="25"/>
</g>
<g>
<!-- Guidance bars, each copied in six green-yellow-orange-red bands -->
<g transform="translate(60 525)"><rect width="190" height="28" rx="14" fill="#4caf32"/><rect x="32" width="32" height="28" fill="#6bc43c"/><rect x="64" width="32" height="28" fill="#a5d63f"/><rect x="96" width="32" height="28" fill="#f0cf48"/><rect x="128" width="32" height="28" fill="#ef9c32"/><rect x="160" width="30" height="28" rx="14" fill="#ed4b32"/><path d="M75 28 L94 58 L56 58Z" fill="#000"/></g>
<g transform="translate(400 525)"><rect width="190" height="28" rx="14" fill="#4caf32"/><rect x="32" width="32" height="28" fill="#6bc43c"/><rect x="64" width="32" height="28" fill="#a5d63f"/><rect x="96" width="32" height="28" fill="#f0cf48"/><rect x="128" width="32" height="28" fill="#ef9c32"/><rect x="160" width="30" height="28" rx="14" fill="#ed4b32"/><path d="M15 28 L34 58 L-4 58Z" fill="#000"/></g>
<g transform="translate(740 525)"><rect width="190" height="28" rx="14" fill="#4caf32"/><rect x="32" width="32" height="28" fill="#6bc43c"/><rect x="64" width="32" height="28" fill="#a5d63f"/><rect x="96" width="32" height="28" fill="#f0cf48"/><rect x="128" width="32" height="28" fill="#ef9c32"/><rect x="160" width="30" height="28" rx="14" fill="#ed4b32"/><path d="M20 28 L39 58 L1 58Z" fill="#000"/></g>
<g transform="translate(60 1015)"><rect width="190" height="28" rx="14" fill="#4caf32"/><rect x="32" width="32" height="28" fill="#6bc43c"/><rect x="64" width="32" height="28" fill="#a5d63f"/><rect x="96" width="32" height="28" fill="#f0cf48"/><rect x="128" width="32" height="28" fill="#ef9c32"/><rect x="160" width="30" height="28" rx="14" fill="#ed4b32"/><path d="M141 28 L160 58 L122 58Z" fill="#000"/></g>
<g transform="translate(400 1015)"><rect width="190" height="28" rx="14" fill="#4caf32"/><rect x="32" width="32" height="28" fill="#6bc43c"/><rect x="64" width="32" height="28" fill="#a5d63f"/><rect x="96" width="32" height="28" fill="#f0cf48"/><rect x="128" width="32" height="28" fill="#ef9c32"/><rect x="160" width="30" height="28" rx="14" fill="#ed4b32"/><path d="M139 28 L158 58 L120 58Z" fill="#000"/></g>
<g transform="translate(740 1015)"><rect width="190" height="28" rx="14" fill="#4caf32"/><rect x="32" width="32" height="28" fill="#6bc43c"/><rect x="64" width="32" height="28" fill="#a5d63f"/><rect x="96" width="32" height="28" fill="#f0cf48"/><rect x="128" width="32" height="28" fill="#ef9c32"/><rect x="160" width="30" height="28" rx="14" fill="#ed4b32"/><path d="M171 28 L190 58 L152 58Z" fill="#000"/></g>
</g></svg>